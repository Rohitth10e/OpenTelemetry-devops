# This is a basic workflow to help you get started with Actions
name: product-catalog-ci
on:
    pull_request:
        branches:
            - main
    push:
        branches:
            - main

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            
            - name: setup go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.22

            - name: Build
              run: go build -o product-catalog-service src/product-catalog/main.go
            
            - name: Unit Tests
              run: go test ./src/product-catalog/... -v
    code-quality:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4

            - name: Code Quality
              run: golangci-lint run ./src/product-catalog/... --timeout 5m

    docker:
        runs-on: ubuntu-latest
        needs: build

        steps:
            - name: checkout code
              uses: actions/checkout@v4
            
            - name: Install Docker
              uses: docker/setup-buildx-action@v1
            
            - name: Login to DockerHub
              uses: docker/login-action@v2
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_TOKEN }}
            
            - name: Build and Push Docker Image
              uses: docker/build-push-action@v4
              with:
                context: src/product-catalog
                file: Dockerfile
                push: true
                tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{github.run_id}}
            
    update-k8s:
        runs-on: ubuntu-latest
        needs: docker

        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                token: ${{ secrets.GITHUB_TOKEN }}

            - name: update tag in k8s deployment
              run: |
                kubectl set image deployment/product-catalog-deployment product-catalog-service=${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{github.run_id}} -n product-catalog
            
         